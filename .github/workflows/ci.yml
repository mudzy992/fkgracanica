name: CI

# CI-01 (AUDIT) — static jobovi + audit gate.
# Proširenja (CI-02/03/04) dodaju servise, FE test suite i mobile E2E — vidi docs/CI.md.

on:
  push:
    branches: [arena/290a6f13-fkgracanica]
  workflow_dispatch:

# NAMJERNO nema pull_request okidača — repo radi isključivo na aktivnoj grani,
# nikad PR prema main (pravilo korisnika; docs/CI.md §Aktivna grana).

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-gate:
    name: audit-gate (coverage matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: check-coverage (matrica mora pokrivati sve izvorne fajlove)
        run: node scripts/audit/check-coverage.mjs

  standards:
    name: standards (check:all)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: check:all (file-size, console-ban, secrets-ban, layer-deps, docs-links)
        run: node scripts/standards/check-all.mjs

  build-test:
    name: build + test (backend, frontend)
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts traži DATABASE_URL pri učitavanju (kao Docker build-arg).
      # generate/validate se NE spajaju na bazu — dummy vrijednost je sigurna.
      DATABASE_URL: postgresql://ci_placeholder:ci_placeholder@localhost:5432/ci_placeholder
    steps:
      # Ratchet poredi posljednji push, čak i ako sadrži više commitova.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Coverage ratchet ne dozvoljava sniženje pragova
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          previous="$PREVIOUS_SHA"
          if [[ -z "$previous" || "$previous" =~ ^0+$ ]]; then
            previous="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [[ -n "$previous" ]]; then
            git cat-file -e "$previous^{commit}" || { echo "Nedostaje prethodni commit za ratchet."; exit 1; }
            if git cat-file -e "$previous:frontend/coverage-baseline.json" 2>/dev/null; then
              git show "$previous:frontend/coverage-baseline.json" > "$RUNNER_TEMP/frontend-coverage-previous.json"
              node scripts/standards/frontend-coverage.mjs --previous "$RUNNER_TEMP/frontend-coverage-previous.json"
            else
              echo "Početni coverage baseline — prethodni još ne postoji."
            fi
          else
            echo "Početni coverage baseline — nema prethodnog commita."
          fi
      - name: npm ci (root lock — F-015 popravljen u CI-01)
        run: npm ci
      - name: prisma generate (Docker build radi ovo na buildu)
        run: npm run db:generate
      - name: prisma validate
        run: npx prisma validate
        working-directory: backend
      - name: backend build (nest/tsc)
        run: npm run build -w backend
      # Logovi runa nisu čitljivi iz dev sanduća (blob EOF) → na FAILURE emitujemo
      # izlaz kao chunked ::error annotacije (svaki chunk <3600 znakova zbog limita).
      - name: backend unit testovi (jest; e2e dolazi u CI-02)
        run: |
          set +e
          npm run test -w backend -- --ci > /tmp/jest.out 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            python3 - <<'PYEOF' > /tmp/jest.ann
          lines = open('/tmp/jest.out', errors='replace').read().splitlines()
          summary = [l for l in lines if l.startswith(('Tests:', 'Test Suites:', 'FAIL '))]
          print(f"::error title=jest ::{' | '.join(summary)[:3400]}")
          chunks, buf = [], ''
          for l in lines:
            if len(buf) + len(l) + 1 > 3400:
                chunks.append(buf)
                buf = ''
            buf += l + '\n'
          if buf:
            chunks.append(buf)
          for i, c in enumerate(chunks[:6], 1):
            print(f"::error title=jest {i}/{min(len(chunks), 6)}::" + c.replace('%', '%25').replace('\n', '%0A'))
          PYEOF
            cat /tmp/jest.ann
          fi
          tail -8 /tmp/jest.out
          exit $code
      - name: backend lint (eslint, check-only)
        working-directory: backend
        run: |
          set +e
          npx eslint "{src,apps,libs,test}/**/*.ts" -f json -o /tmp/eslint.json 2>/tmp/eslint.err
          code=$?
          if [ $code -ne 0 ]; then
            python3 - <<'PYEOF'
          import json
          data = json.load(open('/tmp/eslint.json'))
          lines, nerr, nwarn = [], 0, 0
          for f in data:
            for m in f.get('messages', []):
                sev = 'error' if m.get('severity') == 2 else 'warn'
                if sev == 'error':
                    nerr += 1
                else:
                    nwarn += 1
                p = f['filePath'].split('/fkgracanica/')[-1]
                lines.append(f"{p}:{m.get('line')}:{m.get('column')} [{sev}] {m.get('ruleId')}: {m.get('message')}")
          print(f"::error title=eslint total::{nerr} errors, {nwarn} warns")
          chunks, buf = [], ''
          for l in lines:
            if len(buf) + len(l) + 1 > 3400:
                chunks.append(buf)
                buf = ''
            buf += l + '\n'
          if buf:
            chunks.append(buf)
          for i, c in enumerate(chunks[:8], 1):
            print(f"::error title=eslint {i}/{min(len(chunks), 8)}::" + c.replace('%', '%25').replace('\n', '%0A'))
          PYEOF
          fi
          tail -3 /tmp/eslint.err 2>/dev/null
          exit $code
      - name: frontend build (tsc -b + vite)
        run: npm run build -w frontend
      # CI-04/B-CI04-03: monorepo ima dvije kopije Reacta (mobile/Expo pinuje
      # 19.2.3, frontend 19.3.1) — bez `resolve.dedupe` bundle sadrži obje i
      # stranica padne sa "Cannot read properties of null (reading 'useEffect')".
      - name: frontend bundle (jedna kopija Reacta)
        run: node scripts/standards/bundle-react.mjs
      - name: Bundle budget (test gatea i 8 metrika)
        run: |
          node --test scripts/standards/bundle-budget.test.mjs
          node scripts/standards/bundle-budget.mjs
      - name: frontend test i V8 coverage (baseline ratchet)
        id: frontend_coverage
        run: |
          if ! npm run test:coverage -w frontend > "$RUNNER_TEMP/frontend-coverage.log" 2>&1; then
            cat "$RUNNER_TEMP/frontend-coverage.log"
            node -e "const t=require('fs').readFileSync(process.env.RUNNER_TEMP+'/frontend-coverage.log','utf8').split('\n').slice(-60).join(' ').slice(-3200).replaceAll('%','%25').replaceAll('\r','%0D'); console.log('::error title=frontend coverage::'+t)"
            exit 1
          fi
          cat "$RUNNER_TEMP/frontend-coverage.log"
      - name: Coverage obuhvat, test gatea i GitHub summary
        if: ${{ always() && (steps.frontend_coverage.outcome == 'success' || steps.frontend_coverage.outcome == 'failure') }}
        run: |
          node --test scripts/standards/frontend-coverage.test.mjs
          if ! node scripts/standards/frontend-coverage.mjs --markdown > "$RUNNER_TEMP/frontend-coverage-summary.md" 2> "$RUNNER_TEMP/frontend-coverage-scope.err"; then
            cat "$RUNNER_TEMP/frontend-coverage-scope.err"
            node -e "const t=require('fs').readFileSync(process.env.RUNNER_TEMP+'/frontend-coverage-scope.err','utf8').slice(0,3000).replaceAll('%','%25').replaceAll('\n','%0A').replaceAll('\r','%0D'); console.log('::error title=frontend coverage scope::'+t)"
            exit 1
          fi
          cat "$RUNNER_TEMP/frontend-coverage-summary.md" >> "$GITHUB_STEP_SUMMARY"
      # P-FE06-42: coverage je na plafonu, a preostale grane su odbrane koje se
      # kroz UI ne mogu izvršiti. Svaka takva linija mora biti u registru
      # `AUDIT/dead-guards.json`; nova nepokrivena linija van registra ruši job.
      - name: Mrtve zaštite (registar + test skripte)
        if: ${{ always() && steps.frontend_coverage.outcome == 'success' }}
        run: |
          node --test scripts/audit/dead-guards.test.mjs
          if ! node scripts/audit/dead-guards.mjs > "$RUNNER_TEMP/dead-guards.log" 2>&1; then
            cat "$RUNNER_TEMP/dead-guards.log"
            node -e "const t=require('fs').readFileSync(process.env.RUNNER_TEMP+'/dead-guards.log','utf8').slice(0,3200).replaceAll('%','%25').replaceAll('\n','%0A').replaceAll('\r','%0D'); console.log('::error title=dead-guards::'+t)"
            exit 1
          fi
          cat "$RUNNER_TEMP/dead-guards.log"
      - name: Frontend coverage izvještaj
        if: ${{ always() && (steps.frontend_coverage.outcome == 'success' || steps.frontend_coverage.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn
          retention-days: 7
      - name: frontend lint (oxlint)
        run: npm run lint -w frontend

  # P-FE06-1/3: izolovani browser mockovi i axe nisu full-stack E2E.
  browser-mock:
    name: browser mock + axe (web)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm ci
        run: npm ci
      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && break
            echo "Pokušaj $i neuspješan za chromium --with-deps, retry za 5s..."
            sleep 5
          done
      - name: Build web sa relativnim testnim API putem
        run: npm run build:browser -w frontend
      - name: Izolovani mock browser i axe gate
        run: |
          if ! npm run test:browser:mock -w frontend > "$RUNNER_TEMP/browser-mock.log" 2>&1; then
            cat "$RUNNER_TEMP/browser-mock.log"
            node -e "const t=require('fs').readFileSync(process.env.RUNNER_TEMP+'/browser-mock.log','utf8').split('\n').slice(-55).join(' ').slice(-3200).replaceAll('%','%25').replaceAll('\r','%0D'); console.log('::error title=browser mock::'+t)"
            exit 1
          fi
          cat "$RUNNER_TEMP/browser-mock.log"
      - name: Browser trace na padu (samo testni podaci)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-mock-failure
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # BE-09c/P-B09c-4: e2e suite se prije NIJE izvršavao nigdje (8 specova / 729
  # LOC). Job diže Postgres + Redis, primijeni sve migracije, seeduje RBAC +
  # settings + admin (+ demo sadržaj koji e2e specovi koriste) i pokrene
  # `npm run test:e2e`.
  e2e:
    name: e2e (postgres + redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          # BE-09c: lokalna trust auth unutar runnera — DATABASE_URL tako ne
          # sadrži ugrađenu lozinku (secrets-ban pravilo, F-001 klasa).
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fkgracanica_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/fkgracanica_e2e?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: ci-e2e-access-secret
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      ADMIN_EMAIL: admin@fkgracanica.ba
      ADMIN_PASSWORD: Admin123!
      SEED_DEMO: '1'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm ci
        run: npm ci
      - name: prisma generate
        run: npm run db:generate
      - name: prisma migrate deploy
        run: npx prisma migrate deploy
        working-directory: backend
      - name: prisma seed (RBAC + settings + admin + demo)
        run: npm run prisma:seed -w backend
      - name: e2e suite
        run: |
          set +e
          npm run test:e2e -w backend -- --ci --json --outputFile=/tmp/e2e.json > /tmp/e2e.out 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E 'Tests:|Suites:' /tmp/e2e.out
            node -e "
              const r = require('/tmp/e2e.json');
              const failed = r.testResults.flatMap((s) =>
                s.assertionResults
                  .filter((a) => a.status === 'failed')
                  .map((a) => a.fullName + ' :: ' + (a.failureMessages[0] || '').split('\n').slice(0, 12).join(' ')),
              );
              const msg = (failed.join(' || ') || 'nema detalja').slice(0, 6000).replace(/[\r\n]+/g, ' ');
              console.log('::error title=e2e failed::' + msg);
            "
            exit $code
          fi
          grep -E 'Tests:|Suites:' /tmp/e2e.out

  # P-FE06-2: zasebna, svježa baza/Redis i stvarni backend; bez produkcijskih podataka.
  browser-fullstack:
    name: browser smoke (backend + postgres + redis)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fk_browser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/fk_browser_test?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: test
      ADMIN_EMAIL: browser-smoke@example.test
      E2E_BACKEND_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Privremeni sintetički kredencijali
        run: |
          for key in ADMIN_PASSWORD JWT_ACCESS_SECRET JWT_REFRESH_SECRET; do
            value=$(node -e "process.stdout.write(require('crypto').randomBytes(24).toString('hex'))")
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: npm ci
        run: npm ci
      - name: Instaliraj Chromium i sistemske zavisnosti
        working-directory: frontend
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && break
            echo "Pokušaj $i neuspješan za chromium --with-deps, retry za 5s..."
            sleep 5
          done
      - name: Generiši Prisma klijent, migriraj praznu bazu i učitaj test seed
        run: |
          if ! (npm run db:generate && cd backend && npx prisma migrate deploy && npx ts-node prisma/seed/browser-smoke.ts) > "$RUNNER_TEMP/browser-setup.log" 2>&1; then
            cat "$RUNNER_TEMP/browser-setup.log"
            node -e "const t=require('fs').readFileSync(process.env.RUNNER_TEMP+'/browser-setup.log','utf8').split('\n').slice(-35).join(' ').slice(-3200).replaceAll('%','%25').replaceAll('\r','%0D'); console.log('::error title=browser setup::'+t)"
            exit 1
          fi
          cat "$RUNNER_TEMP/browser-setup.log"
      - name: Provjeri Redis
        run: |
          node --input-type=module -e "import Redis from 'ioredis'; const r = new Redis(process.env.REDIS_URL); try { if (await r.ping() !== 'PONG') process.exitCode = 1; } finally { await r.quit(); }"
      - name: Build backend i relativni web
        run: |
          npm run build -w backend
          npm run build:browser -w frontend
      - name: Pokreni backend i čekaj health status baze
        run: |
          npm run start:prod -w backend > "$RUNNER_TEMP/browser-backend.log" 2>&1 &
          if ! node frontend/e2e/support/wait-for-backend.mjs; then
            tail -100 "$RUNNER_TEMP/browser-backend.log"
            exit 1
          fi
      - name: Stvarni browser smoke (bez vanjskih browser veza i plaćanja)
        run: |
          if ! npm run test:browser:fullstack -w frontend -- --workers=1 --repeat-each=3 > "$RUNNER_TEMP/browser-smoke.log" 2>&1; then
            cat "$RUNNER_TEMP/browser-smoke.log"
            node -e "const t=require('fs').readFileSync(process.env.RUNNER_TEMP+'/browser-smoke.log','utf8').split('\n').slice(-40).join(' ').slice(-3200).replaceAll('%','%25').replaceAll('\r','%0D'); console.log('::error title=browser smoke::'+t)"
            exit 1
          fi
          cat "$RUNNER_TEMP/browser-smoke.log"
      - name: Regresija javnog XHR-a prije full-stack navigacije
        working-directory: frontend
        run: |
          if ! E2E_VISIT_DELAY_MS=3000 npx playwright test --project=fullstack-desktop --workers=1 e2e/portal.fullstack.spec.ts > "$RUNNER_TEMP/browser-delayed-visit.log" 2>&1; then
            cat "$RUNNER_TEMP/browser-delayed-visit.log"
            node -e "const t=require('fs').readFileSync(process.env.RUNNER_TEMP+'/browser-delayed-visit.log','utf8').split('\n').slice(-40).join(' ').slice(-3000).replaceAll('%','%25').replaceAll('\r','%0D'); console.log('::error title=delayed public XHR::'+t)"
            exit 1
          fi
          cat "$RUNNER_TEMP/browser-delayed-visit.log"
      - name: Browser trace na padu (isključivo privremeni testni podaci)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-fullstack-failure
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 3
