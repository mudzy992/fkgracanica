name: CI

# CI-01 (AUDIT) — static jobovi + audit gate.
# Proširenja (CI-02/03/04) dodaju servise, FE test suite i mobile E2E — vidi docs/CI.md.

on:
  push:
    branches: [arena/290a6f13-fkgracanica]
  workflow_dispatch:

# NAMJERNO nema pull_request okidača — repo radi isključivo na aktivnoj grani,
# nikad PR prema main (pravilo korisnika; docs/CI.md §Aktivna grana).

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-gate:
    name: audit-gate (coverage matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: check-coverage (matrica mora pokrivati sve izvorne fajlove)
        run: node scripts/audit/check-coverage.mjs

  standards:
    name: standards (check:all)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: check:all (file-size, console-ban, secrets-ban, layer-deps, docs-links)
        run: node scripts/standards/check-all.mjs

  build-test:
    name: build + test (backend, frontend)
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts traži DATABASE_URL pri učitavanju (kao Docker build-arg).
      # generate/validate se NE spajaju na bazu — dummy vrijednost je sigurna.
      DATABASE_URL: postgresql://ci_placeholder:ci_placeholder@localhost:5432/ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm ci (root lock — F-015 popravljen u CI-01)
        run: npm ci
      - name: prisma generate (Docker build radi ovo na buildu)
        run: npm run db:generate
      - name: prisma validate
        run: npx prisma validate
        working-directory: backend
      - name: backend build (nest/tsc)
        run: npm run build -w backend
      # Logovi runa nisu čitljivi iz dev sanduća (blob EOF) → na FAILURE emitujemo
      # izlaz kao chunked ::error annotacije (svaki chunk <3600 znakova zbog limita).
      - name: backend unit testovi (jest; e2e dolazi u CI-02)
        run: |
          set +e
          npm run test -w backend -- --ci > /tmp/jest.out 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            python3 - <<'PYEOF' > /tmp/jest.ann
          lines = open('/tmp/jest.out', errors='replace').read().splitlines()
          summary = [l for l in lines if l.startswith(('Tests:', 'Test Suites:', 'FAIL '))]
          print(f"::error title=jest ::{' | '.join(summary)[:3400]}")
          chunks, buf = [], ''
          for l in lines:
            if len(buf) + len(l) + 1 > 3400:
                chunks.append(buf)
                buf = ''
            buf += l + '\n'
          if buf:
            chunks.append(buf)
          for i, c in enumerate(chunks[:6], 1):
            print(f"::error title=jest {i}/{min(len(chunks), 6)}::" + c.replace('%', '%25').replace('\n', '%0A'))
          PYEOF
            cat /tmp/jest.ann
          fi
          tail -8 /tmp/jest.out
          exit $code
      - name: backend lint (eslint, check-only)
        working-directory: backend
        run: |
          set +e
          npx eslint "{src,apps,libs,test}/**/*.ts" -f json -o /tmp/eslint.json 2>/tmp/eslint.err
          code=$?
          if [ $code -ne 0 ]; then
            python3 - <<'PYEOF'
          import json
          data = json.load(open('/tmp/eslint.json'))
          lines, nerr, nwarn = [], 0, 0
          for f in data:
            for m in f.get('messages', []):
                sev = 'error' if m.get('severity') == 2 else 'warn'
                if sev == 'error':
                    nerr += 1
                else:
                    nwarn += 1
                p = f['filePath'].split('/fkgracanica/')[-1]
                lines.append(f"{p}:{m.get('line')}:{m.get('column')} [{sev}] {m.get('ruleId')}: {m.get('message')}")
          print(f"::error title=eslint total::{nerr} errors, {nwarn} warns")
          chunks, buf = [], ''
          for l in lines:
            if len(buf) + len(l) + 1 > 3400:
                chunks.append(buf)
                buf = ''
            buf += l + '\n'
          if buf:
            chunks.append(buf)
          for i, c in enumerate(chunks[:8], 1):
            print(f"::error title=eslint {i}/{min(len(chunks), 8)}::" + c.replace('%', '%25').replace('\n', '%0A'))
          PYEOF
          fi
          tail -3 /tmp/eslint.err 2>/dev/null
          exit $code
      - name: frontend build (tsc -b + vite)
        run: npm run build -w frontend
      - name: frontend lint (oxlint)
        run: npm run lint -w frontend

  # BE-09c/P-B09c-4: e2e suite se prije NIJE izvršavao nigdje (8 specova / 729
  # LOC). Job diže Postgres + Redis, primijeni sve migracije, seeduje RBAC +
  # settings + admin (+ demo sadržaj koji e2e specovi koriste) i pokrene
  # `npm run test:e2e`.
  e2e:
    name: e2e (postgres + redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          # BE-09c: lokalna trust auth unutar runnera — DATABASE_URL tako ne
          # sadrži ugrađenu lozinku (secrets-ban pravilo, F-001 klasa).
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fkgracanica_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/fkgracanica_e2e?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: ci-e2e-access-secret
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      ADMIN_EMAIL: admin@fkgracanica.ba
      ADMIN_PASSWORD: Admin123!
      SEED_DEMO: '1'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm ci
        run: npm ci
      - name: prisma generate
        run: npm run db:generate
      - name: prisma migrate deploy
        run: npx prisma migrate deploy
        working-directory: backend
      - name: prisma seed (RBAC + settings + admin + demo)
        run: npm run prisma:seed -w backend
      - name: e2e suite
        run: |
          set +e
          npm run test:e2e -w backend -- --ci > /tmp/e2e.out 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error title=e2e failed::$(grep -E '✕|●|Tests:|Suites:' /tmp/e2e.out | tail -40 | tr '\n' '|' | cut -c1-3400)"
            tail -60 /tmp/e2e.out
          else
            grep -E 'Tests:|Suites:' /tmp/e2e.out
          fi
          exit $code
