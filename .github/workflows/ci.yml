name: CI

# CI-01 (AUDIT) — static jobovi + audit gate.
# Proširenja (CI-02/03/04) dodaju servise, FE test suite i mobile E2E — vidi docs/CI.md.

on:
  push:
    branches: [arena/290a6f13-fkgracanica]
  workflow_dispatch:

# NAMJERNO nema pull_request okidača — repo radi isključivo na aktivnoj grani,
# nikad PR prema main (pravilo korisnika; docs/CI.md §Aktivna grana).

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-gate:
    name: audit-gate (coverage matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: check-coverage (matrica mora pokrivati sve izvorne fajlove)
        run: node scripts/audit/check-coverage.mjs

  standards:
    name: standards (check:all)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: check:all (file-size, console-ban, secrets-ban, layer-deps, docs-links)
        run: node scripts/standards/check-all.mjs

  build-test:
    name: build + test (backend, frontend)
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts traži DATABASE_URL pri učitavanju (kao Docker build-arg).
      # generate/validate se NE spajaju na bazu — dummy vrijednost je sigurna.
      DATABASE_URL: postgresql://ci_placeholder:ci_placeholder@localhost:5432/ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm ci (root lock — F-015 popravljen u CI-01)
        run: npm ci
      - name: prisma generate (Docker build radi ovo na buildu)
        run: npm run db:generate
      - name: prisma validate
        run: npx prisma validate
        working-directory: backend
      - name: backend build (nest/tsc)
        run: npm run build -w backend
      # Logovi runa nisu čitljivi iz dev sanduća (blob EOF) → na FAILURE emitujemo
      # izlaz kao chunked ::error annotacije (svaki chunk <3600 znakova zbog limita).
      - name: backend unit testovi (jest; e2e dolazi u CI-02)
        run: |
          set +e
          npm run test -w backend -- --ci > /tmp/jest.out 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            python3 - <<'PYEOF' > /tmp/jest.ann
          lines = open('/tmp/jest.out', errors='replace').read().splitlines()
          summary = [l for l in lines if l.startswith(('Tests:', 'Test Suites:', 'FAIL '))]
          print(f"::error title=jest ::{' | '.join(summary)[:3400]}")
          chunks, buf = [], ''
          for l in lines:
            if len(buf) + len(l) + 1 > 3400:
                chunks.append(buf)
                buf = ''
            buf += l + '\n'
          if buf:
            chunks.append(buf)
          for i, c in enumerate(chunks[:6], 1):
            print(f"::error title=jest {i}/{min(len(chunks), 6)}::" + c.replace('%', '%25').replace('\n', '%0A'))
          PYEOF
            cat /tmp/jest.ann
          fi
          tail -8 /tmp/jest.out
          exit $code
      - name: backend lint (eslint, check-only)
        working-directory: backend
        run: |
          set +e
          npx eslint "{src,apps,libs,test}/**/*.ts" -f json -o /tmp/eslint.json 2>/tmp/eslint.err
          code=$?
          if [ $code -ne 0 ]; then
            python3 - <<'PYEOF'
          import json
          data = json.load(open('/tmp/eslint.json'))
          lines, nerr, nwarn = [], 0, 0
          for f in data:
            for m in f.get('messages', []):
                sev = 'error' if m.get('severity') == 2 else 'warn'
                if sev == 'error':
                    nerr += 1
                else:
                    nwarn += 1
                p = f['filePath'].split('/fkgracanica/')[-1]
                lines.append(f"{p}:{m.get('line')}:{m.get('column')} [{sev}] {m.get('ruleId')}: {m.get('message')}")
          print(f"::error title=eslint total::{nerr} errors, {nwarn} warns")
          chunks, buf = [], ''
          for l in lines:
            if len(buf) + len(l) + 1 > 3400:
                chunks.append(buf)
                buf = ''
            buf += l + '\n'
          if buf:
            chunks.append(buf)
          for i, c in enumerate(chunks[:8], 1):
            print(f"::error title=eslint {i}/{min(len(chunks), 8)}::" + c.replace('%', '%25').replace('\n', '%0A'))
          PYEOF
          fi
          tail -3 /tmp/eslint.err 2>/dev/null
          exit $code
      - name: frontend build (tsc -b + vite)
        run: npm run build -w frontend
      - name: frontend lint (oxlint)
        run: npm run lint -w frontend
