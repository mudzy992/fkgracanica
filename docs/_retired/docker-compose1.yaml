# ⚠️ PENZIONISANO (retired) 2026-11-02 — D-005 (Q-05): Traefik NE POSTOJI u
# infrastrukturi; jedini produkcioni okvir je Coolify → docker-compose.yml.
# Ovaj fajl je historijski dokaz (stari Traefik stack s vlastitim redis servisom).
# NE KORISTITI za deploy. Indeks penzionisanih fajlova: docs/_retired/INDEX.md
#
# Produkcija — Traefik (mreža web), TLS le, host fkgracanica.ba101.top
# Prije prvog up: ./scripts/setup-upload-dir.sh  (chown 999:999 za user `app` u kontejneru)
# Build: docker compose build && docker compose up -d

services:
  redis:
    image: redis:7-alpine
    container_name: fkgracanica-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - fkgracanica-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - '127.0.0.1:6379:6379'

  backend:
    image: fkgracanica-backend:prod
    container_name: fkgracanica-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
      UPLOAD_PATH: /app/uploads
      API_PUBLIC_URL: https://fkgracanica.ba101.top/backend
      SOCKET_IO_PATH: /socket.io
      # Unutar Docker mreže "web" (Traefik) baza je dostupna preko naziva
      # servisa "postgres", ne preko javnog hosta sql.ba101.top — zato
      # ovdje eksplicitno pravimo internu konekcionu nit i njome
      # prepisujemo DATABASE_URL iz .env (koji ostaje sa javnim hostom,
      # za CLI/migracije van kontejnera). DB_PROVIDER je informativan —
      # koji provider je aktivan vidi u prisma/schema.prisma.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_PROVIDER: postgres
    volumes:
      - /mnt/shared-app-files/fkgracanica:/app/uploads
    networks:
      - web
      - fkgracanica-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.fkgracanica-api.rule=Host(`fkgracanica.ba101.top`) && PathPrefix(`/backend`)
      - traefik.http.routers.fkgracanica-api.entrypoints=websecure
      - traefik.http.routers.fkgracanica-api.tls=true
      - traefik.http.routers.fkgracanica-api.tls.certresolver=le
      - traefik.http.routers.fkgracanica-api.priority=100
      - traefik.http.routers.fkgracanica-api.middlewares=fkgracanica-backend-strip
      - traefik.http.middlewares.fkgracanica-backend-strip.stripprefix.prefixes=/backend
      - traefik.http.services.fkgracanica-api.loadbalancer.server.port=3000
      - traefik.http.services.fkgracanica-api.loadbalancer.healthcheck.path=/api/v1/health
      - traefik.http.services.fkgracanica-api.loadbalancer.healthcheck.interval=30s

  frontend:
    image: fkgracanica-frontend:prod
    container_name: fkgracanica-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://fkgracanica.ba101.top/backend/api/v1
    networks:
      - web
      - fkgracanica-network
    environment:
      INTERNAL_API_URL: http://backend:3000/api/v1
    depends_on:
      - backend
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.fkgracanica-web.rule=Host(`fkgracanica.ba101.top`)
      - traefik.http.routers.fkgracanica-web.entrypoints=websecure
      - traefik.http.routers.fkgracanica-web.tls=true
      - traefik.http.routers.fkgracanica-web.tls.certresolver=le
      - traefik.http.routers.fkgracanica-web-http.rule=Host(`fkgracanica.ba101.top`)
      - traefik.http.routers.fkgracanica-web-http.entrypoints=web
      - traefik.http.routers.fkgracanica-web-http.middlewares=fkgracanica-redirect-https
      - traefik.http.routers.fkgracanica-web-http.service=fkgracanica-web
      - traefik.http.middlewares.fkgracanica-redirect-https.redirectscheme.scheme=https
      - traefik.http.middlewares.fkgracanica-redirect-https.redirectscheme.permanent=true
      - traefik.http.services.fkgracanica-web.loadbalancer.server.port=3000
      - traefik.http.services.fkgracanica-web.loadbalancer.healthcheck.path=/
      - traefik.http.services.fkgracanica-web.loadbalancer.healthcheck.interval=30s

networks:
  web:
    external: true
  fkgracanica-network:
    name: fkgracanica-network
    driver: bridge

volumes:
  redis_data:
